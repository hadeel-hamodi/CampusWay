<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusWay Sensor Test</title>

<style>
  body{
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:30px auto;
    padding:20px;
  }

  button{
    font-size:18px;
    padding:12px 20px;
    margin-bottom:20px;
  }

  .value{
    font-size:22px;
    margin:14px 0;
  }

  #log{
    margin-top:25px;
    padding:15px;
    background:#f3f4f6;
    border-radius:8px;
  }
</style>
</head>

<body>

<h1>CampusWay Sensor Test</h1>

<button id="enableBtn">Enable Sensors</button>

<div class="value">
  Heading: <strong id="heading">--</strong>°
</div>

<div class="value">
  Acceleration: <strong id="accel">0.00</strong>
</div>

<div class="value">
  Accel range:
  <strong id="range">0.00 to 0.00</strong>
</div>

<div class="value">
  Detected steps: <strong id="steps">0</strong>
</div>

<div id="log">Sensors not enabled.</div>

<script>
let gravityMag = 9.81;
let filteredAccel = 0;

let minAccel = 0;
let maxAccel = 0;

let stepPeakDetected = false;
let stepDipDetected = false;

let lastStepAt = 0;
let detectedSteps = 0;

function $(id){
  return document.getElementById(id);
}

async function enableSensors(){
  try{
    if(typeof DeviceMotionEvent !== 'undefined' &&
       typeof DeviceMotionEvent.requestPermission === 'function'){
      const result = await DeviceMotionEvent.requestPermission();

      if(result !== 'granted'){
        throw new Error('Motion permission denied');
      }
    }

    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();

      if(result !== 'granted'){
        throw new Error('Orientation permission denied');
      }
    }

    window.addEventListener('devicemotion', updateMotion);
    window.addEventListener('deviceorientation', updateHeading, true);

    $('log').textContent = 'Sensors enabled.';
    $('enableBtn').disabled = true;

  }catch(err){
    $('log').textContent = err.message || 'Could not enable sensors.';
  }
}

function updateHeading(e){
  let heading = null;

  if(typeof e.webkitCompassHeading === 'number'){
    heading = e.webkitCompassHeading;
  }
  else if(typeof e.alpha === 'number'){
    heading = (360 - e.alpha) % 360;
  }

  if(heading !== null && Number.isFinite(heading)){
    $('heading').textContent = heading.toFixed(0);
  }
}

function updateMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if(!a) return;

  const x = Number(a.x) || 0;
  const y = Number(a.y) || 0;
  const z = Number(a.z) || 0;

  const magnitude = Math.sqrt(x*x + y*y + z*z);

  gravityMag = gravityMag * 0.92 + magnitude * 0.08;

  const linear = magnitude - gravityMag;

  filteredAccel =
    filteredAccel * 0.65 +
    linear * 0.35;

  minAccel = Math.min(minAccel, filteredAccel);
  maxAccel = Math.max(maxAccel, filteredAccel);

  $('accel').textContent = filteredAccel.toFixed(2);

  $('range').textContent =
    `${minAccel.toFixed(2)} to ${maxAccel.toFixed(2)}`;

  detectStep();
}

function detectStep(){
  const now = performance.now();

  if(!stepPeakDetected && filteredAccel > 0.8){
    stepPeakDetected = true;
  }

  if(stepPeakDetected && filteredAccel < -0.4){
    stepDipDetected = true;
  }

  if(stepPeakDetected &&
     stepDipDetected &&
     filteredAccel > -0.1){

    stepPeakDetected = false;
    stepDipDetected = false;

    const interval = now - lastStepAt;

    if(interval >= 350 && interval <= 1000){
      lastStepAt = now;
      detectedSteps++;

      $('steps').textContent = detectedSteps;
    }
    else if(interval > 1000){
      lastStepAt = now;
    }
  }
}

$('enableBtn').onclick = enableSensors;
</script>

</body>
</html>
