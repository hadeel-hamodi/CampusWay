<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusWay Sensor Test</title>

<style>
  body{
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:30px auto;
    padding:20px;
  }

  button{
    font-size:18px;
    padding:12px 20px;
    margin-bottom:20px;
  }

  .value{
    font-size:22px;
    margin:14px 0;
  }

  #log{
    margin-top:25px;
    padding:15px;
    background:#f3f4f6;
    border-radius:8px;
  }
</style>
</head>

<body>

<h1>CampusWay Sensor Test</h1>

<button id="enableBtn">Enable Sensors</button>

<div class="value">
  Heading: <strong id="heading">--</strong>°
</div>

<div class="value">
  Acceleration: <strong id="accel">0.00</strong>
</div>

<div class="value">
  Accel range:
  <strong id="range">0.00 to 0.00</strong>
</div>

<div class="value">
  Detected steps: <strong id="steps">0</strong>
</div>

<div class="value">
  Step candidates: <strong id="candidates">0</strong>
</div>

<div class="value">
  Walking: <strong id="walking">NO</strong>
</div>

<div class="value">
  Beta: <strong id="beta">--</strong>°
</div>

<div class="value">
  Gamma: <strong id="gamma">--</strong>°
</div>

<div class="value">
  Beta range: <strong id="betaRange">--</strong>
</div>

<div class="value">
  Gamma range: <strong id="gammaRange">--</strong>
</div>
<div id="log">Sensors not enabled.</div>

<script>
let gravityMag = 9.81;
let filteredAccel = 0;

let minAccel = 0;
let maxAccel = 0;

let stepPeakDetected = false;
let stepDipDetected = false;

let detectedSteps = 0;
let candidateCount = 0;

const stepCandidates = [];

const CADENCE_MIN = 350;
const CADENCE_MAX = 1000;
const CONFIRM_COUNT = 3;
const WALKING_TIMEOUT = 1500;

let minBeta = Infinity;
let maxBeta = -Infinity;
let minGamma = Infinity;
let maxGamma = -Infinity;

let isWalking = false;
let lastConfirmedCandidate = 0;

function $(id){
  return document.getElementById(id);
}

async function enableSensors(){
  try{
    if(typeof DeviceMotionEvent !== 'undefined' &&
       typeof DeviceMotionEvent.requestPermission === 'function'){
      const result = await DeviceMotionEvent.requestPermission();

      if(result !== 'granted'){
        throw new Error('Motion permission denied');
      }
    }

    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      const result = await DeviceOrientationEvent.requestPermission();

      if(result !== 'granted'){
        throw new Error('Orientation permission denied');
      }
    }

    window.addEventListener('devicemotion', updateMotion);
    window.addEventListener('deviceorientation', updateHeading, true);

    $('log').textContent = 'Sensors enabled.';
    $('enableBtn').disabled = true;

  }catch(err){
    $('log').textContent = err.message || 'Could not enable sensors.';
  }
}

function updateHeading(e){
  let heading = null;

  if(typeof e.webkitCompassHeading === 'number'){
    heading = e.webkitCompassHeading;
  }
  else if(typeof e.alpha === 'number'){
    heading = (360 - e.alpha) % 360;
  }

  if(heading !== null && Number.isFinite(heading)){
    $('heading').textContent = heading.toFixed(0);
  }

  if(typeof e.beta === 'number'){
    minBeta = Math.min(minBeta, e.beta);
    maxBeta = Math.max(maxBeta, e.beta);

    $('beta').textContent = e.beta.toFixed(1);
    $('betaRange').textContent =
      `${minBeta.toFixed(1)} to ${maxBeta.toFixed(1)}`;
  }

  if(typeof e.gamma === 'number'){
    minGamma = Math.min(minGamma, e.gamma);
    maxGamma = Math.max(maxGamma, e.gamma);

    $('gamma').textContent = e.gamma.toFixed(1);
    $('gammaRange').textContent =
      `${minGamma.toFixed(1)} to ${maxGamma.toFixed(1)}`;
  }
}

function updateMotion(e){
  const a = e.accelerationIncludingGravity || e.acceleration;
  if(!a) return;

  const x = Number(a.x) || 0;
  const y = Number(a.y) || 0;
  const z = Number(a.z) || 0;

  const magnitude = Math.sqrt(x*x + y*y + z*z);

  gravityMag = gravityMag * 0.92 + magnitude * 0.08;

  const linear = magnitude - gravityMag;

  filteredAccel =
    filteredAccel * 0.65 +
    linear * 0.35;

  minAccel = Math.min(minAccel, filteredAccel);
  maxAccel = Math.max(maxAccel, filteredAccel);

  $('accel').textContent = filteredAccel.toFixed(2);

  $('range').textContent =
    `${minAccel.toFixed(2)} to ${maxAccel.toFixed(2)}`;

  detectStep();
  if(isWalking &&
   performance.now() - lastConfirmedCandidate > WALKING_TIMEOUT){

  isWalking = false;
  stepCandidates.length = 0;
  $('walking').textContent = 'NO';
}
}

function detectStep(){
  if(!stepPeakDetected && filteredAccel > 0.8){
    stepPeakDetected = true;
  }

  if(stepPeakDetected && filteredAccel < -0.4){
    stepDipDetected = true;
  }

  if(stepPeakDetected &&
     stepDipDetected &&
     filteredAccel > -0.1){

    stepPeakDetected = false;
    stepDipDetected = false;

    addStepCandidate();
  }
}

function addStepCandidate(){
  const now = performance.now();

  candidateCount++;
  $('candidates').textContent = candidateCount;

  // If the previous candidate was too recent,
  // ignore this one as part of the walking rhythm.
  if(stepCandidates.length){
    const gap = now - stepCandidates[stepCandidates.length - 1];

    if(gap < CADENCE_MIN){
      return;
    }

    // Long pause = start a new possible walking sequence.
    if(gap > CADENCE_MAX){
      stepCandidates.length = 0;
    }
  }

  stepCandidates.push(now);

  // We need 3 rhythmic candidates before declaring walking.
  if(!isWalking){
    if(stepCandidates.length >= CONFIRM_COUNT){
      isWalking = true;
      $('walking').textContent = 'YES';

      // These candidates represent real steps too,
      // so don't throw away the first two.
      detectedSteps += stepCandidates.length;
      $('steps').textContent = detectedSteps;

      lastConfirmedCandidate = now;

      // Keep the latest candidate as the beginning
      // of the continuing cadence.
      stepCandidates.splice(0, stepCandidates.length - 1);
    }

    return;
  }

  // Already walking: each valid rhythmic candidate is a step.
  detectedSteps++;
  $('steps').textContent = detectedSteps;
  lastConfirmedCandidate = now;

  stepCandidates.splice(0, stepCandidates.length - 1);
}

$('enableBtn').onclick = enableSensors;
</script>

</body>
</html>
